<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета века ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #ffeef2; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(255, 182, 193, 0.5); text-align: center; max-width: 450px; width: 100%; min-height: 520px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .screen.active { display: flex; }
        h1, h2 { color: #d1496c; margin-bottom: 15px; font-size: 20px; line-height: 1.4; }
        
        /* Стили для красивых картинок */
        .step-img { width: 100%; max-width: 280px; height: 140px; object-fit: cover; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); display: block; }
        
        .btn-group { display: flex; gap: 15px; justify-content: center; align-items: center; width: 100%; height: 60px; position: relative; }
        button { padding: 12px 28px; font-size: 16px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-yes { background-color: #4caf50; color: white; z-index: 10; }
        .btn-no { background-color: #f44336; color: white; position: absolute; z-index: 10; }
        .options-list { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 15px; }
        
        .option-item { background: #fff5f7; border: 2px solid #ffd1dc; padding: 12px; border-radius: 15px; cursor: pointer; font-size: 15px; font-weight: bold; color: #555; text-align: left; transition: all 0.2s; }
        .option-item * { pointer-events: none; }
        
        .option-item:hover, .option-item.selected { background: #ffe3e9; border-color: #d1496c; transform: scale(1.02); }
        .btn-next { background-color: #d1496c; color: white; width: 100%; }
        .btn-next:disabled { background-color: #cccccc; cursor: not-allowed; }
        .progress-bar { width: 100%; height: 6px; background-color: #eee; border-radius: 3px; margin-bottom: 15px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: #d1496c; width: 0%; transition: width 0.3s ease; }
    </style>
</head>
<body>

    <div class="card">
        <div class="progress-bar" id="pBar" style="display: none;"><div class="progress-fill" id="pFill"></div></div>

        <div class="screen active" id="screen1">
            <h1>Пойдешь со мной на свидание? 🥺</h1>
            <img class="step-img" src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?w=400&auto=format&fit=crop&q=60" alt="Свидание">
            <div class="btn-group" id="btnContainer">
                <button class="btn-yes" onclick="startQuiz()">Да!</button>
                <button class="btn-no" id="noBtn">Нет</button>
            </div>
        </div>

        <div class="screen" id="screen2">
            <h2>1. Что будем кушать? 🍕</h2>
            <img class="step-img" src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=400&auto=format&fit=crop&q=60" alt="Еда">
            <div class="options-list">
                <div class="option-item" onclick="selectOpt(2, this, 'Паста/Пицца 🇮🇹')"><span>🇮🇹 Итальянская классика</span></div>
                <div class="option-item" onclick="selectOpt(2, this, 'Суши/Роллы 🥢')"><span>🥢 Суши (буду красиво ронять их в соус)</span></div>
